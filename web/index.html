<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EZ-Rent — Quản lý phòng trọ</title>
<meta name="description" content="EZ-Rent: quản lý phòng, hợp đồng, điện nước, hóa đơn và sự cố cho dãy trọ">
<meta name="theme-color" content="#f8f5ee">
<link rel="icon" type="image/svg+xml" href="/brand/mark.svg?v=1">
<link rel="preload" href="/fonts/be-vietnam-pro-vietnamese-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/app.css?v=20261024a">
</head>
<body>

<!-- ============================ ĐĂNG NHẬP ============================ -->
<div id="login-wrap" class="hidden">
  <main class="login">
    <img class="login-logo" src="/brand/logo.svg?v=1" alt="EZ-Rent" width="120" height="111">
    <h1>Đăng nhập</h1>
    <form id="login-form" autocomplete="on">
      <div class="field"><label for="u">Tên đăng nhập</label>
        <input id="u" name="username" autocomplete="username" required></div>
      <div class="field"><label for="p">Mật khẩu</label>
        <input id="p" name="password" type="password" autocomplete="current-password" required></div>
      <button class="btn block" type="submit" id="login-btn">Đăng nhập</button>
      <div class="err" id="login-err" role="alert"></div>
    </form>
    <div class="demo hidden">
      <p>Tài khoản dùng thử — điền tên đăng nhập:</p>
      <button type="button" class="linkish" data-user="admin">admin (chủ trọ)</button>
      <button type="button" class="linkish" data-user="quanly">quanly (quản lý)</button>
      <button type="button" class="linkish" data-user="khach01">khach01 (người thuê)</button>
    </div>
    <p class="login-foot">Quên mật khẩu? Liên hệ chủ trọ để được cấp lại.</p>
  </main>
</div>

<!-- ============================ ỨNG DỤNG ============================ -->
<div id="app" class="hidden">
  <header class="mast">
    <a class="wordmark" href="#" id="home-link"><img src="/brand/wordmark.svg?v=1" alt="EZ-Rent" width="125" height="22"></a>
    <div class="me" id="me"></div>
  </header>
  <nav class="tabs" aria-label="Mục chính"><div class="tabs-in" id="nav"></div></nav>
  <main class="page" id="view"></main>
</div>
<div id="toasts" role="status" aria-live="polite"></div>

<script src="/app.js?v=20261024a" defer></script>
</body>
</html>

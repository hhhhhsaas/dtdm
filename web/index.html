<!-- ============================ ĐĂNG NHẬP ============================ -->
<div id="login-wrap" class="hidden">
  <main class="login">
    <div class="card">
      <img class="login-logo brand-light" src="/brand/logo.svg?v=1" alt="EZ-Rent" width="104" height="96">
      <img class="login-logo brand-dark" src="/brand/logo-dark.svg?v=1" alt="EZ-Rent" width="104" height="96">
      <h1>Đăng nhập</h1>
      <form id="login-form" autocomplete="on">
        <div class="field"><label for="u">Tên đăng nhập</label>
          <input id="u" name="username" autocomplete="username" required></div>
        <div class="field"><label for="p">Mật khẩu</label>
          <input id="p" name="password" type="password" autocomplete="current-password" required></div>
        <button class="btn block" type="submit" id="login-btn">Đăng nhập</button>
        <div class="err" id="login-err" role="alert"></div>
      </form>
      <div class="demo hidden">
        <p>Tài khoản dùng thử — điền tên đăng nhập:</p>
        <button type="button" class="linkish" data-user="admin">admin (chủ trọ)</button>
        <button type="button" class="linkish" data-user="quanly">quanly (quản lý)</button>
        <button type="button" class="linkish" data-user="khach01">khach01 (người thuê)</button>
      </div>
      <p class="login-foot">Quên mật khẩu? Liên hệ chủ trọ để được cấp lại.</p>
    </div>
  </main>
</div>

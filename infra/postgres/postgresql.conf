# ============================================================================
#  CẤU HÌNH POSTGRESQL cho VPS 16 GB chạy 8 database của 8 microservice
#  Tham khảo: pgtune.org — chọn "Mixed storage hoặc SSD"
# ============================================================================

# ---- Kết nối ---------------------------------------------------------------
# 8 service × (pool_size 10 + overflow 10) + admin + migration
max_connections = 200
superuser_reserved_connections = 3

# ---- Bộ nhớ ---------------------------------------------------------------
shared_buffers = 2GB                   # ~25% RAM
effective_cache_size = 4GB             # ~50% RAM — quét được bao nhiêu dữ liệu
work_mem = 8MB                         # tránh cấp phát đột ngột trên NVMe
maintenance_work_mem = 512MB           # VACUUM/CREATE INDEX
autovacuum_work_mem = 256MB

# ---- WAL & checkpoint ------------------------------------------------------
wal_level = replica
max_wal_size = 2GB
min_wal_size = 128MB
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
wal_compression = zstd                 # giảm ~30% dung lượng WAL

# ---- Truy vấn -------------------------------------------------------------
random_page_cost = 1.1                 # ⭐ SSD/NVMe: mặc định 4.0 là quá cao
                                        #    Đặt quá cao khiến planner chọn seq scan
                                        #    khi index scan rẻ hơn nhiều
effective_io_concurrency = 200
default_statistics_target = 100
jit = off                              # PostgreSQL 16: tắt JIT cho truy vấn ngắn
                                        #    (JIT thường làm chậm truy vấn < 100ms)

# ---- Ghi & độ bền ---------------------------------------------------------
synchronous_commit = on                # BẬT. An toàn dữ liệu > hiệu năng.
                                        # Đổi 'off' có thể mất dữ liệu khi
                                        # mất điện đột ngột.
fsync = on
full_page_writes = on
# (data_checksums KHÔNG đặt ở đây — là tham số initdb-only, đã bật qua
#  POSTGRES_INITDB_ARGS=--data-checksums; đặt lại đây làm postgres FATAL
#  "parameter cannot be changed" khi khởi động)

# ---- Ghi log --------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_duration_statement = 500       # log truy vấn chậm hơn 500ms
log_checkpoints = on
log_connections = off                  # quá nhiều log nếu bật
log_disconnections = off
log_lock_waits = on
log_temp_files = 8MB                   # log khi ghi tạm > 8MB (dấu hiệu thiếu work_mem)
log_lock_waits = on
deadlock_timeout = 1s

# ---- Tự bảo trì ------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms

# ---- Xác thực & bảo mật ----------------------------------------------------
listen_addresses = '*'
password_encryption = scram-sha-256
# Nội bộ: service chạy trong network qlpt-data (internal: true) — không TLS
# (mTLS là hướng mở rộng, xem docs/06-bao-mat.md §6.8 "Sao không dùng TLS
#  cho nội bộ service-to-service?"). Bật `ssl = on` đòi hỏi cert server.crt/
# server.key — trước đây gây FATAL vì compose không mount certs vào postgres.
ssl = off
# ssl_cert_file = '/etc/postgresql/certs/server.crt'
# ssl_key_file  = '/etc/postgresql/certs/server.key'

# ---- Báo cáo --------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top
track_io_timing = on

# ---- Bảng mã hóa cột nhạy cảm (CCCD) --------------------------------------
# xem docs/06-bao-mat.md mục 6.5

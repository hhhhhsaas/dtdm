auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# ⭐ QUAN TRỌNG: đặt giới hạn lưu trữ. Mặc định Loki giữ log vô hạn
#   → sẽ làm đầy ổ đĩa. Phải đặt retention ngay từ đầu.
limits_config:
  retention_period: 720h            # 30 ngày
  ingestion_rate_mb: 8              # giới hạn tốc độ ghi
  ingestion_burst_size_mb: 16
  max_global_streams_per_user: 10000
  max_query_series: 5000
  max_query_lookback: 720h
  reject_old_samples: true
  reject_old_samples_max_age: 168h  # từ chối log cũ hơn 7 ngày
  max_cache_freshness_per_query: 10m
  allow_structured_metadata: true
  volume_enabled: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# Dữ liệu thống kê định kỳ cho dashboard
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

analytics:
  reporting_enabled: false

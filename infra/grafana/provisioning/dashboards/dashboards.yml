apiVersion: 1

providers:
  - name: 'QLPT Dashboards'
    orgId: 1
    folder: 'QLPT'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30      # Grafana tự nạp lại khi file dashboard thay đổi
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false

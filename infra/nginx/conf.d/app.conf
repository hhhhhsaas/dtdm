# ============================================================================
#  ĐỊNH TUYẾN — chuyển /api/v1/<domain> tới đúng microservice
#  Giữ nguyên path (không rewrite) để: Swagger hiển thị URL thật,
#  log nginx đối chiếu được với log service.
# ============================================================================

# ---------- Chuyển HTTP → HTTPS (trừ khi đang ở localhost trong lúc dev) ----
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME HTTP-01 challenge — phải phục vụ trước khi chuyển hướng
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- Trang lỗi tập trung -------------------------------------------
server {
    listen 8081;
    server_name _;

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        internal;
        default_type application/json;
        return 503 '{"error":"Dịch vụ tạm thời không sẵn sàng. Vui lòng thử lại sau.","code":503}';
    }
    location / { return 404 '{"error":"Not found"}'; }
}

# ---------- HTTPS chính ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qlpt.vn www.qlpt.vn qlpt.local;

    # --- TLS ---
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # ======================================================================
    #  ĐỊNH TUYẾN API — mỗi service phơi NHIỀU "domain" prefix, KHÔNG phải
    #  /api/v1/<tên-service>. Bảng dưới khớp CHÍNH XÁC với các
    #  APIRouter(prefix=...) trong services/<svc>/main.py.
    #
    #  ⭐ CÁC location API TUYỆT ĐỐI KHÔNG để dấu "/" ở cuối.
    #     Nếu viết "location /api/v1/rooms/" thì nginx sẽ trả 301 cho đúng
    #     "/api/v1/rooms" (thêm "/"), rồi service lại trả 307 ngược về
    #     "/api/v1/rooms" (bỏ "/") → LẶP REDIRECT → trình duyệt báo
    #     "Failed to fetch" (ERR_TOO_MANY_REDIRECTS). Bỏ "/" cuối là hết.
    #     Location dài hơn (VD /api/v1/rooms/available) vẫn thắng theo
    #     nguyên tắc longest-prefix nên KHÔNG bị ảnh hưởng.
    # ======================================================================

    # --- auth-service (8001): /auth (công khai), /users ---
    location /api/v1/auth {
        limit_req  zone=auth    burst=5  nodelay;
        limit_req  zone=general burst=20 nodelay;
        proxy_pass http://auth_backend;
        include /etc/nginx/proxy_common.conf;
    }
    location /api/v1/users { limit_req zone=general burst=30 nodelay;
                             proxy_pass http://auth_backend;
                             include /etc/nginx/proxy_common.conf; }

    # --- room-service (8002): rooms, properties, buildings, amenities ---
    # --- Danh mục phòng công khai (tìm phòng trống) ---
    location /api/v1/rooms/available {
        limit_req zone=general burst=50 nodelay;
        proxy_pass http://room_backend;
        include /etc/nginx/proxy_common.conf;

        # ⭐ Cache 30 giây: giảm tải DB rõ rệt vì đây là trang được xem nhiều nhất
        proxy_cache            qlpt;
        proxy_cache_key        "$scheme$request_method$host$request_uri";
        proxy_cache_valid      200 30s;
        proxy_cache_use_stale  error timeout updating;
        proxy_cache_lock       on;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header X-Cache-Status $upstream_cache_status always;
    }
    location /api/v1/rooms      { limit_req zone=api burst=100 nodelay;
                                  proxy_pass http://room_backend;
                                  include /etc/nginx/proxy_common.conf; }
    location /api/v1/properties { proxy_pass http://room_backend;
                                  include /etc/nginx/proxy_common.conf; }
    location /api/v1/buildings  { proxy_pass http://room_backend;
                                  include /etc/nginx/proxy_common.conf; }
    location /api/v1/amenities  { proxy_pass http://room_backend;
                                  include /etc/nginx/proxy_common.conf; }

    # --- tenant-service (8003): tenants, roommates ---
    location /api/v1/tenants   { limit_req zone=api burst=100 nodelay;
                                 proxy_pass http://tenant_backend;
                                 include /etc/nginx/proxy_common.conf; }
    location /api/v1/roommates { proxy_pass http://tenant_backend;
                                 include /etc/nginx/proxy_common.conf; }

    # --- contract-service (8004): contracts ---
    location /api/v1/contracts { proxy_pass http://contract_backend;
                                 include /etc/nginx/proxy_common.conf; }

    # --- billing-service (8005): invoices, pricing, meter-readings,
    #     billing-jobs, estimates. Nới rate limit vì tính tiền 200 hóa đơn. ---
    location /api/v1/invoices       { limit_req zone=api burst=200 nodelay;
                                      proxy_pass http://billing_backend;
                                      include /etc/nginx/proxy_common.conf; }
    location /api/v1/pricing        { proxy_pass http://billing_backend;
                                      include /etc/nginx/proxy_common.conf; }
    location /api/v1/meter-readings { proxy_pass http://billing_backend;
                                      include /etc/nginx/proxy_common.conf; }
    location /api/v1/billing-jobs   { proxy_pass http://billing_backend;
                                      include /etc/nginx/proxy_common.conf; }
    location /api/v1/estimates      { proxy_pass http://billing_backend;
                                      include /etc/nginx/proxy_common.conf; }

    # --- notification-service (8006): notifications, templates ---
    location /api/v1/notifications { proxy_pass http://notify_backend;
                                     include /etc/nginx/proxy_common.conf; }
    location /api/v1/templates     { proxy_pass http://notify_backend;
                                     include /etc/nginx/proxy_common.conf; }

    # --- maintenance-service (8007): incidents, maintenance-schedules ---
    location /api/v1/incidents             { proxy_pass http://maintenance_backend;
                                             include /etc/nginx/proxy_common.conf; }
    location /api/v1/maintenance-schedules { proxy_pass http://maintenance_backend;
                                             include /etc/nginx/proxy_common.conf; }

    # --- report-service (8008): reports ---
    location /api/v1/reports { limit_req zone=general burst=30 nodelay;
                               proxy_pass http://report_backend;
                               include /etc/nginx/proxy_common.conf; }

    # --- Tài liệu API (chỉ mở trong mạng nội bộ — không public ra Internet) ---
    location ~ ^/(docs|redoc|openapi.json)$ {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 192.168.0.0/16;
        allow 172.16.0.0/12;
        deny  all;
        proxy_pass http://api_docs;
        include /etc/nginx/proxy_common.conf;
    }

    # ======================================================================
    #  GIAO DIỆN WEB (SPA tĩnh)
    # ======================================================================
    location / {
        root /srv/web;
        index index.html;
        try_files $uri $uri/ /index.html;   # hỗ trợ client-side routing
    }

    # Cache dài hạn cho asset. ⭐ Đổi nội dung thì đổi ?v= trong index.html
    # (VD app.js?v=20261023), nếu không trình duyệt giữ bản cũ 30 ngày.
    location ~* \.(js|css|woff2|woff|ttf|png|jpe?g|svg|webp|ico)$ {
        root /srv/web;
        expires 30d;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Không cache HTML. CSP chỉ gắn cho trang web (không gắn khối http vì
    # Swagger ở /docs tải script từ CDN, CSP chặt sẽ làm hỏng trang đó).
    #   script-src 'self'  → chỉ chạy /app.js, chặn script chèn qua XSS
    #   style-src  'unsafe-inline' → trang dùng <style> và style="" nội tuyến
    location = /index.html {
        root /srv/web;
        include /etc/nginx/conf.d/security_headers.inc;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cache-Control "no-store, must-revalidate";
    }
}

# ============================================================================
#  NGINX — Reverse Proxy / API Gateway / TLS
#  Thay thế hoàn toàn chức năng của một Load Balancer + API Gateway trên đám mây
# ============================================================================

user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ---------------- Ghi log có cấu trúc (đọc được bởi Loki/Promtail) ----------
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"upstream_addr":"$upstream_addr",'
        '"request_id":"$request_id",'
        '"referrer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # ---------------- Hiệu năng --------------------------------------------
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    server_tokens   off;              # ⭐ không lộ phiên bản nginx
    client_max_body_size 20M;         # cho phép upload ảnh CCCD, ảnh sự cố
    client_body_timeout 15s;

    # ---------------- Nén -------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      image/svg+xml font/woff font/woff2;

    # ---------------- Bảo mật response headers ----------------------------
    add_header X-Content-Type-Options   "nosniff"            always;
    add_header X-Frame-Options          "SAMEORIGIN"         always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Rate limiting ----
    # 3 vùng: tổng, đăng nhập (chặt), API chung
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:5m    rate=5r/s;
    limit_req_zone $binary_remote_addr zone=api:10m    rate=60r/s;

    # ---- Kết nối giới hạn theo IP ----
    limit_conn_zone $binary_remote_addr zone=perip:10m;
    limit_conn perip 30;

    # ---- Cache đọc nhiều (danh mục phòng trống) ----
    proxy_cache_path /var/cache/nginx/qlpt levels=1:2 keys_zone=qlpt:20m
                     max_size=256m inactive=5m use_temp_path=off;

    # ======================== UPSTREAM: nhóm các bản sao ====================
    # ⭐ `resolver` + `resolve` (nginx ≥ 1.27.3): nginx hỏi lại DNS nội bộ của
    #     Docker (127.0.0.11) mỗi 10s để cập nhật IP của container. Nhờ vậy khi
    #     một service được TẠO LẠI (docker compose up -d → IP mới), nginx tự
    #     trỏ sang IP mới trong ~10s mà KHÔNG cần restart/reload — trước đây
    #     không có dòng này thì nginx giữ IP cũ và trả 502 Bad Gateway.
    #     Mỗi upstream có `resolve` cần kèm 1 `zone` để chia sẻ giữa các worker.

    # least_conn: chọn máy ít kết nối nhất — tốt hơn round_robin khi
    # thời gian xử lý request khác nhau (billing chậm hơn room nhiều)
    # backup: chỉ dùng khi toàn bộ server chính đã chết
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream auth_backend {
        zone auth_backend 64k;
        least_conn;
        server auth:8001        resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream room_backend {
        zone room_backend 64k;
        least_conn;
        server room:8002        resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream tenant_backend {
        zone tenant_backend 64k;
        least_conn;
        server tenant:8003      resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream contract_backend {
        zone contract_backend 64k;
        least_conn;
        server contract:8004    resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream billing_backend {
        zone billing_backend 64k;
        least_conn;
        server billing:8005     resolve max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream notify_backend {
        zone notify_backend 64k;
        least_conn;
        server notification:8006 resolve max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream maintenance_backend {
        zone maintenance_backend 64k;
        least_conn;
        server maintenance:8007 resolve max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream report_backend {
        zone report_backend 64k;
        least_conn;
        server report:8008      resolve max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    # Tài liệu API nội bộ (Swagger UI) — chỉ mở trong mạng nội bộ.
    # Hệ thống KHÔNG có service tổng hợp docs riêng, nên /docs, /redoc,
    # /openapi.json trỏ tới auth-service (cửa ngõ xác thực, điểm bắt đầu mọi
    # luồng). Tài liệu của TỪNG service vẫn xem trực tiếp trên cổng 8001–8008.
    upstream api_docs {
        zone api_docs 64k;
        server auth:8001        resolve max_fails=3 fail_timeout=30s;
    }

    include /etc/nginx/conf.d/*.conf;
}

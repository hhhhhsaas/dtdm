# Cấu hình dùng chung cho mọi service — include bằng include proxy_common.conf;
proxy_http_version 1.1;
proxy_set_header Connection "";

# --- ⭐ QUAN TRỌNG: truyền đúng IP thật của client ---
# Thiếu 3 dòng này thì mọi request sẽ ghi log là đến từ IP của nginx,
# khiến rate limit và nhật ký không dùng được, cả log ứng dụng cũng vô nghĩa.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Khóa truy vết 1 request xuyên qua nhiều service
proxy_set_header X-Request-ID      $request_id;

# --- Timeout ---
proxy_connect_timeout 5s;
proxy_send_timeout    10s;
proxy_read_timeout    15s;

# --- Chỉ retry khi KHÔNG chắc chắn server đã xử lý ---
# Retry sau khi đã đọc response có thể tạo hóa đơn trùng.
proxy_next_upstream error timeout http_502 http_503 http_504;
proxy_next_upstream_tries 2;
proxy_next_upstream_timeout 10s;

# --- Buffering: đẩy băng thông tối đa sang nginx, giảm tải cho FastAPI ---
proxy_buffering          on;
proxy_buffer_size        16k;
proxy_buffers            8 16k;
proxy_busy_buffers_size  32k;
proxy_request_buffering  on;

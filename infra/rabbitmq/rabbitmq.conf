# ============================================================================
#  RABBITMQ — cấu hình server
# ============================================================================

# Nạp định nghĩa exchange/queue/binding từ file (khai báo sẵn trong compose)
# ⚠️ definitions.json BẮT BUỘC là JSON THUẦN — KHÔNG có dòng comment (#) hay
#    dấu phẩy cuối. Trước đây file có vài dòng comment ở đầu → RabbitMQ báo
#    "BOOT FAILED ... exit:{error,not_json}" và crash-loop.
management.load_definitions = /etc/rabbitmq/definitions.json

# Nghe AMQP chỉ trong mạng nội bộ
listeners.tcp.default = 5672

# ---- Bộ nhớ (container giới hạn 512MB) ----
# Phải để memory_high_watermark thấp hơn giới hạn container,
# nếu không RabbitMQ sẽ bị OOM kill trước khi tự giải phóng bộ nhớ.
vm_memory_high_watermark.relative = 0.4

# ---- Tối đa kết nối ----
# 8 service × 2 connection + admin + consumer nhiều = ~60
mnesia_table_loading_retry_timeout = 30000

# ---- Cụm: KHÔNG cấu hình (chỉ chạy 1 node) ----
# Trước đây đặt cluster_formation.classic_config.nodes.1 = rabbit@qlpt-rabbitmq
# nhưng hostname container lại là container-id → node cục bộ là
# rabbit@<container-id> KHÔNG nằm trong danh sách → RabbitMQ kẹt ở bước
# "virgin node -> run peer discovery" (boot không bao giờ xong → unhealthy).
# Với 1 node thì bỏ hẳn peer discovery cho boot nhanh, xác định.

# ---- Bảo mật ----
# Đổi mặc định guest/guest — chỉ cho phép từ localhost
loopback_users.guest = true
# Bật TLS khi có nhiều host thật:
#   listeners.ssl.default = 5671

# ---- Thống kê quảng trị ----
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0
prometheus.return_per_object_metrics = true
# ⚠️ Bỏ prometheus.return_per_object_metrics_type — RabbitMQ không có setting
#    này (lỗi "unknown variable" làm BOOT FAILED). Chỉ giữ return_per_object_metrics.

# ---- Log ----
log.file.level = info
log.console = true
log.console.level = info
